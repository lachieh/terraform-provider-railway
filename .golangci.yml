version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - gocritic
    - revive
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1005
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: ^internal/
        linters:
          - revive
        text: "exported|package-comments|should have a package comment"
      # internal/iac is a port of railwayapp/cli and similar; it keeps the
      # upstream control flow and messages so it can be re-synced line by line.
      - path: ^internal/iac/
        linters:
          - staticcheck
        text: "QF1001"
      - path: ^internal/iac/
        linters:
          - gocritic
        text: "ifElseChain"
      - path: ^internal/iac/
        linters:
          - revive
        text: "redefines-builtin-id|error-strings"

formatters:
  enable:
    - gofmt
    - goimports
