name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: make fmt-check

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: make vet

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  test:
    name: go test -race (${{ matrix.cli }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cli: [tofu, terraform]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install OpenTofu
        if: matrix.cli == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false
      - name: Install Terraform
        if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Test
        env:
          # The lifecycle tests drive this CLI against an in-memory Railway
          # environment; fail rather than skip when it is missing.
          RAILWAY_REQUIRE_CLI: "1"
          RAILWAY_TEST_CLI: ${{ matrix.cli }}
        run: make test-race

  docs:
    name: docs drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false
      - name: Regenerate and compare
        run: make docs-check

  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false
      - name: Check formatting and validate
        run: make examples-check

  # Acceptance runs spend the Railway token's hourly request quota, so they
  # run for main and on demand, not for every pull request.
  acceptance:
    name: acceptance (${{ matrix.cli }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [fmt, vet, lint, test]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - cli: opentofu
            provider_host: registry.opentofu.org
          - cli: terraform
            provider_host: registry.terraform.io
    concurrency:
      group: acceptance-railway-account
      cancel-in-progress: false
    env:
      RAILWAY_ACC_TOKEN: ${{ secrets.RAILWAY_ACC_TOKEN }}
      RAILWAY_ACC_PROJECT_ID: ${{ vars.RAILWAY_ACC_PROJECT_ID }}
    steps:
      - name: Check for acceptance credentials
        id: gate
        run: |
          if [ -n "$RAILWAY_ACC_TOKEN" ] && [ -n "$RAILWAY_ACC_PROJECT_ID" ]; then
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          else
            echo "enabled=false" >>"$GITHUB_OUTPUT"
            echo "::notice::RAILWAY_ACC_TOKEN or RAILWAY_ACC_PROJECT_ID is not available (fork or unconfigured); skipping acceptance tests."
          fi
      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install OpenTofu
        if: steps.gate.outputs.enabled == 'true' && matrix.cli == 'opentofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false
      - name: Install Terraform
        if: steps.gate.outputs.enabled == 'true' && matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Run acceptance tests
        if: steps.gate.outputs.enabled == 'true'
        env:
          TF_ACC: "1"
          TF_ACC_PROVIDER_HOST: ${{ matrix.provider_host }}
          TF_ACC_PROVIDER_NAMESPACE: tambo-ai
          MATRIX_CLI: ${{ matrix.cli }}
        run: |
          if [ "$MATRIX_CLI" = opentofu ]; then
            TF_ACC_TERRAFORM_PATH="$(command -v tofu)"
          else
            TF_ACC_TERRAFORM_PATH="$(command -v terraform)"
          fi
          export TF_ACC_TERRAFORM_PATH
          "$TF_ACC_TERRAFORM_PATH" version
          go test ./internal/provider/... -run TestAcc -v -timeout 120m
